name: Node Pokedex CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: node-app

      - name: Lint Helm chart
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0
      - run: helm lint node-chart

      - name: Setup Kind
        uses: helm/kind-action@v1

      - name: Create Kind cluster
        run: kind create cluster --name ci-cluster

      - name: Build Docker image
        run: |
          docker build -t pokedex-node-app:latest ./node-app
          kind load docker-image pokedex-node-app:latest --name ci-cluster

      - name: Deploy Helm chart
        run: |
          helm upgrade --install pokedex-node-chart node-chart \
            --set image.repository=pokedex-node-app \
            --set image.tag=latest \
            --wait

      - name: Test Node app
        run: |
          POD_NAME=$(kubectl get pods -l app.kubernetes.io/name=pokedex-node-chart -o jsonpath="{.items[0].metadata.name}")
          kubectl port-forward $POD_NAME 3000:3000 &
          sleep 5
          curl -s http://localhost:3000/pokemon/pikachu | grep "pikachu" || exit 1
