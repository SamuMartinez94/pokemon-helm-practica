<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Ultra Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ef5350; --bg: #1a1a2e; --glass: rgba(255, 255, 255, 0.1); }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .card { background: var(--glass); backdrop-filter: blur(15px); border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); text-align: center; }
        
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; background: rgba(255,255,255,0.2); color: white; outline: none; }
        button { background: var(--primary); border: none; padding: 10px 20px; border-radius: 25px; color: white; font-weight: bold; cursor: pointer; }

        /* Sistema de Pestañas */
        .tabs { display: flex; justify-content: space-around; margin: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { background: none; border: none; color: #aaa; padding: 10px; cursor: pointer; font-size: 0.8em; font-weight: 600; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .tab-content { display: none; text-align: left; padding: 15px 0; font-size: 0.9em; }
        .tab-content.active { display: block; }

        /* Estilos de contenido */
        .type-tag { background: var(--primary); padding: 4px 12px; border-radius: 10px; font-size: 0.7em; margin: 2px; display: inline-block; text-transform: uppercase; }
        .stat-bar-bg { background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; margin: 5px 0 12px 0; }
        .stat-bar-fill { background: #4caf50; height: 100%; border-radius: 4px; }
        #poke-img { width: 140px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)); }
        .evo-item { background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 10px; display: inline-block; margin: 3px; font-size: 0.8em; text-transform: capitalize; }
    </style>
</head>
<body>

<div class="card">
    <h1>Pokédex Master</h1>
    <div class="search-box">
        <input type="text" id="name" placeholder="Ej: Pikachu..." onkeypress="if(event.key==='Enter') search()">
        <button onclick="search()">OK</button>
    </div>

    <div id="result" style="display: none;">
        <img id="poke-sprite" src="" alt="pokemon">
        <h2 id="poke-name" style="text-transform: capitalize; margin: 10px 0;"></h2>
        <div id="poke-types"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab(event, 'info')">Info</button>
            <button class="tab-btn" onclick="showTab(event, 'stats')">Stats</button>
            <button class="tab-btn" onclick="showTab(event, 'evo')">Evolución</button>
        </div>

        <div id="info" class="tab-content active">
            <p id="poke-desc" style="font-style: italic; color: #ccc; margin-bottom: 15px;"></p>
            <p><b>Altura:</b> <span id="poke-height"></span> m</p>
            <p><b>Peso:</b> <span id="poke-weight"></span> kg</p>
            <p><b>Hábitat:</b> <span id="poke-habitat"></span></p>
            <p><b>Habilidades:</b> <span id="poke-abilities"></span></p>
        </div>

        <div id="stats" class="tab-content">
            <div id="stats-container"></div>
        </div>

        <div id="evo" class="tab-content">
            <div id="evo-chain" style="text-align: center;"></div>
        </div>
    </div>
</div>

<script>
    function showTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    async function search() {
        const name = document.getElementById("name").value.toLowerCase().trim();
        if (!name) return;

        try {
            const res = await fetch("/pokemon/" + name);
            const data = await res.json();
            if (data.message) { alert(data.message); return; }

            document.getElementById("result").style.display = "block";
            
            // Básicos
            document.getElementById("poke-sprite").src = data.basic.sprite;
            document.getElementById("poke-name").innerText = `${data.basic.name} #${data.basic.id}`;
            document.getElementById("poke-types").innerHTML = data.basic.types.map(t => `<span class="type-tag">${t}</span>`).join('');
            
            // Info Tab
            document.getElementById("poke-desc").innerText = data.extra.description || "Sin descripción.";
            document.getElementById("poke-height").innerText = data.basic.height / 10;
            document.getElementById("poke-weight").innerText = data.basic.weight / 10;
            document.getElementById("poke-habitat").innerText = data.extra.habitat || "Desconocido";
            document.getElementById("poke-abilities").innerText = data.basic.abilities.join(', ');

            // Stats Tab
            document.getElementById("stats-container").innerHTML = data.stats.map(s => `
                <div style="display:flex; justify-content:space-between; font-size:0.7em">
                    <span>${s.name.toUpperCase()}</span><span>${s.value}</span>
                </div>
                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${(s.value/200)*100}%"></div></div>
            `).join('');

            // Evolution Tab
            if(data.evolution) {
                document.getElementById("evo-chain").innerHTML = data.evolution.map(e => `<span class="evo-item">${e}</span>`).join(' → ');
            } else {
                document.getElementById("evo-chain").innerHTML = "No tiene evoluciones conocidas.";
            }

        } catch (e) {
            alert("Error al conectar con el servidor");
        }
    }
</script>

</body>
</html>
